[build]
  command = "npm run build"
  publish = ".next"

[functions]
  # Give all Netlify serverless functions up to 26 seconds
  # (max on Netlify Pro; default is 10s which causes 504 on Firestore calls)
  included_files = ["lib/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.production.environment]
  NODE_ENV = "production"
  # Firebase NEXT_PUBLIC_ keys are intentionally public (client-side). Disable
  # Netlify's smart secrets scanner so it doesn't block the build.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
